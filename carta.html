<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Envelope + Letter (Open/Close on Click)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="floating-decor">
    <span class="petal">🌸</span>
    <span class="petal">💌</span>
    <span class="petal">🌼</span>
    <span class="petal">💗</span>
    <span class="petal">🌸</span>
    <span class="petal">🍓</span>
  </div>

  <div class="container">
    <div class="envelope-wrapper">
      <div class="envelope">
        <div class="letter">
          <div class="text">
            <strong>Para: Juanita</strong>
              <p>
                 Quiero expresarte lo mucho que te quiero y lo agradecido que estoy por tenerte en mi vida. Gracias por compartir conmigo, eres una persona maravillosa y espero que nuestra relación siga creciendo cada día más.
              </p>          
          </div>
        </div>
      </div>
      <div class="heart"></div>
    </div>
  </div>

  <audio id="bgMusic" src="./cancion.mp3" loop></audio></audio>

  <script>
    const envelope = document.querySelector('.envelope-wrapper');
    const music = document.getElementById('bgMusic');

    envelope.addEventListener('click', () => {
      envelope.classList.toggle('flap');
      if (envelope.classList.contains('flap')) {
        music.play().catch((err) => {
          console.error('No se pudo reproducir el audio:', err);
        });
      } else {
        music.pause();
      }
    });

    music.addEventListener('error', () => {
      console.error('Error cargando el archivo de audio. Revisa que "cancion.wav" esté en la misma carpeta que carta.html y se llame exactamente así.');
    });

    // Efecto parallax: el fondo se mueve levemente según la posición del mouse
    document.body.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      document.body.style.backgroundPosition = `calc(50% + ${x}px) calc(50% + ${y}px)`;
    });
  </script>
</body>
</html>
